name: CI Pipeline

on:
  push:
    branches: [ main, "hw1" ]
  merge_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'
  DOCKER_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-flights
  POETRY_VERSION: '1.8.4'
  DOCKER_TAG: ${{ github.sha }}

jobs:
  lint:
    name: Linters and formatters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Install Linters
        run: poetry install --only dev

      - name: Run linters
        run: poetry run pre-commit run --all-files

  build-package:
    needs: lint
    name: Build package and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Build Python package
        run: |
          poetry build
          mkdir -p ../artifacts
          mv dist/* ../artifacts/

      - name: Publish Python package to GitHub Packages
        uses: actions/upload-artifact@v3
        with:
          name: python-package
          path: artifacts/*

  build-image:
    needs: lint
    name: Build Docker image and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ DOCKER_TAG }}

  deploy-docs:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}


      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material

      - name: Build docs
        run: |
          mkdir -p public
          echo "# MLOps Repository" > docs/index.md
          echo "site_name: AITH-MLOPS" > mkdocs.yml
          mkdocs build --site-dir public

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
